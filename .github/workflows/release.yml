name: Release

# A release: push a tag v<x.y.z> equal to VERSION. The tests run, the executable is built on Windows and published
# as a release with sftp-tools-<version>-windows.zip and its .sha256.

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag is VERSION
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG is not v$version (VERSION)"; exit 1; }

      - name: Test
        run: |
          python -m pip install -q -r requirements-dev.txt pyinstaller pillow
          QT_QPA_PLATFORM=offscreen python -m pytest -q tests

      - name: Build
        run: python tools/build_windows_exe.py windist

      - name: Publish
        run: |
          version=${TAG#v}
          awk 'NR > 2 && /^Changelog: / { exit } NR > 2 { print }' CHANGELOG > notes.md
          gh release create "$TAG" windist/*.zip windist/*.zip.sha256 --title "SFTP Tools $version" \
            --notes-file notes.md --verify-tag
