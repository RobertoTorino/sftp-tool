# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# The tests, and the Windows executable built as a release builds it, so a broken build shows before a tag.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt pyinstaller pillow
      - run: python tools/build_windows_exe.py windist
